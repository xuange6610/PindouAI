org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Flutter 3.41 still reads the legacy AGP DSL during assemble. AGP 8.11
# previews the new DSL by default, so keep the compatible interface enabled.
android.newDsl=false
# Windows Gradle has a conservative non-ASCII path guard. The project is
# intentionally stored in a Chinese-named workspace and all active tooling is
# Unicode-safe, so allow this verified path.
android.overridePathCheck=true
# Pub's native plugin sources and the project can live on different Windows
# drive roots; disabling Kotlin incremental caches avoids a known path-relativizing
# warning while preserving deterministic release output.
kotlin.incremental=false
